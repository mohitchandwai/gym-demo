<div class="table-responsive"><table class="table table-bordered table-lg m-0"><thead class="bg-secondary text-white text-center"><tr><th>Day</th><th>Time</th><th>Class</th><th>Trainer</th></tr></thead><tbody class="text-center">
{% for s in rows %}<tr><th class="bg-secondary text-white align-middle">{{ s.get_day_display }}</th><td>{{ s.start|time:"g:i A" }} - {{ s.end|time:"g:i A" }}</td><td><h5 class="m-0">{{ s.name }}</h5></td><td>{{ s.trainer.name|default:"-" }}</td></tr>{% endfor %}</tbody></table></div>
